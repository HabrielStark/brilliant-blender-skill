name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python unit and security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check blender_cinematic mcp_server scripts tests
      - name: Audit repository invariants
        run: python scripts/audit_repo_invariants.py
      - name: Static security scan
        run: bandit -c pyproject.toml -r blender_cinematic mcp_server scripts tests addon
      - name: Run unit and security tests
        run: pytest tests/unit tests/security -q
      - name: Validate skill metadata
        run: python scripts/validate_skill.py
      - name: Build Python distributions
        run: python -m build --sdist --wheel
      - name: Check Python distributions
        run: python -m twine check dist/*.tar.gz dist/*.whl
      - name: Package skill and add-on
        run: python scripts/package_skill.py --out dist
      - name: Generate SBOMs
        run: python scripts/generate_sbom.py --out dist
      - name: Assert release artifacts
        run: python scripts/assert_release_artifacts.py --dist dist

  node:
    name: Node build and GLB tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run Node tests
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run
      - name: Smoke-test npm package install
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          npm init -y
          npm install "$GITHUB_WORKSPACE" --ignore-scripts
          npx bcas-validate-glb --help
          node -e "import('blender-cinematic-web').then(m=>{ if (typeof m.validateGlb !== 'function') throw new Error('missing validateGlb export') })"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: npm run e2e
