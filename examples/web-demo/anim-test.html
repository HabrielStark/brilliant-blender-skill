<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>anim test</title>
<style>html,body{margin:0;height:100%;background:#08090c}#c{width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.__ready = false; window.__error = null;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4, -4.5, 2.4); camera.lookAt(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.2));
let mixer = null; const clock = new THREE.Clock(); let target = null;
new GLTFLoader().load('scene_anim.glb', (g) => {
  scene.add(g.scene);
  window.__childCount = g.scene.children.length;
  window.__clips = g.animations.length;
  target = g.scene.getObjectByName('product_body') || g.scene.children[0];
  window.__rot0 = target ? target.rotation.z : null;
  if (g.animations.length) { mixer = new THREE.AnimationMixer(g.scene);
    g.animations.forEach(c => mixer.clipAction(c).play()); }
  window.__ready = true;
}, undefined, (e) => { window.__error = String(e); window.__ready = true; });
function resize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
(function loop(){ requestAnimationFrame(loop);
  if (mixer) mixer.update(clock.getDelta());
  if (target) window.__rotNow = target.rotation.z;
  renderer.render(scene, camera); })();
</script></body></html>
